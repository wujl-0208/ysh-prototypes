</div>

<input type="file" class="upload-input" id="upload-0" accept="image/jpeg,image/png,image/webp"><input type="file" class="upload-input" id="upload-1" accept="image/jpeg,image/png,image/webp">
<div class="form-row"><label class="form-label" for="skip-bg">按钮背景颜色：</label><div class="form-control"><div class="color-group"><input class="input w110" id="skip-bg" value="#33333366" spellcheck="false"><span class="split"></span><button class="clear-color" data-reset-color="background" aria-label="恢复默认按钮背景颜色"><svg class="icon" aria-hidden="true"><use href="#x-icon"/></svg></button></div></div></div>

<div class="form-row"><label class="form-label required" for="total-time">倒计时：</label><div class="form-control"><div class="unit-field"><input class="input w110" id="total-time" type="number" min="0.5" step="0.1" value="6" aria-describedby="time-error"><span>秒</span></div><p class="error full" id="time-error" aria-live="polite"></p></div></div>
<div class="form-row"><span class="form-label required" id="jump-label-0">图片 1 是否跳转：</span><div class="form-control radio-row" role="radiogroup" aria-labelledby="jump-label-0"><label class="check"><input type="radio" name="jump-0" value="yes" checked>是</label><label class="check"><input type="radio" name="jump-0" value="no">否</label></div></div>
<div class="form-row" id="jump2-row"><span class="form-label required" id="jump-label-1">图片 2 是否跳转：</span><div class="form-control radio-row" role="radiogroup" aria-labelledby="jump-label-1"><label class="check"><input type="radio" name="jump-1" value="yes" checked>是</label><label class="check"><input type="radio" name="jump-1" value="no">否</label></div></div>
<p class="error form-error" id="publish-error" aria-live="polite"></p>

</section>

<nav class="image-tabs" role="tablist" aria-label="图片跳转配置"><button class="image-tab active" id="image-tab-0" role="tab" aria-controls="route-fields" aria-selected="true" data-image-tab="0">图片 1</button><button class="image-tab" id="image-tab-1" role="tab" aria-controls="route-fields" aria-selected="false" tabindex="-1" data-image-tab="1">图片 2</button></nav>
<div class="routes-layout" id="route-fields" role="tabpanel" aria-labelledby="image-tab-0"></div>
<p class="error form-error" id="scope-error" aria-live="polite"></p>

</section>

const $=id=>document.getElementById(id), $$=selector=>Array.from(document.querySelectorAll(selector));
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demoImage=i=>{const bg=i?'#bf622d':'#2766ae', pale=i?'#ffdcb7':'#b8d8fb', title=i?'城市好礼':'城市服务', sub=i?'发现身边的精彩':'让生活更便捷';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="450" height="900" viewBox="0 0 450 900"><rect width="450" height="900" fill="${bg}"/><circle cx="400" cy="670" r="260" fill="none" stroke="${pale}" stroke-width="2" opacity=".38"/><circle cx="400" cy="670" r="200" fill="none" stroke="${pale}" stroke-width="2" opacity=".38"/><circle cx="400" cy="670" r="140" fill="none" stroke="${pale}" stroke-width="2" opacity=".38"/><text x="44" y="255" fill="white" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-weight="600" font-size="57">${title}</text><text x="46" y="309" fill="${pale}" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25">${sub}</text><rect x="46" y="357" width="160" height="44" rx="22" fill="white"/><text x="78" y="387" fill="${bg}" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20">${i?'查看活动':'立即了解'}</text><text x="46" y="829" fill="${pale}" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19">示例素材 · 图片 ${i+1}</text></svg>`)};
const cities=['广州市','韶关市','深圳市','珠海市','汕头市','佛山市','江门市','湛江市','茂名市','肇庆市','惠州市','梅州市','汕尾市','河源市','阳江市','清远市','东莞市','中山市','潮州市','揭阳市','云浮市'];
const platforms=['APP','微信小程序','支付宝小程序'];
const routePlatforms=['APP','支付宝小程序'];
const selectedRoutePlatforms=()=>state.scope.platforms.filter(p=>routePlatforms.includes(p));
const initial=()=>({version:4,prototypeVersion:'V2',images:[{enabled:true,src:demoImage(0),name:'城市服务 · 示例素材',demo:true,jump:true},{enabled:true,src:demoImage(1),name:'城市好礼 · 示例素材',demo:true,jump:true}],publication:{start:'',end:'',position:'App开屏'},playback:{totalMs:6000,first:3000,transition:500,second:3000,effect:'slide',times:1,unit:'ms',distribution:'equal',transitionIncluded:true},skip:{title:'跳过',position:'tr',background:'#33333366',foreground:'#FFFFFF'},scope:{audience:'all',audienceDetail:'',platforms:[...platforms],cities:[...cities],routes:{}}});
let state=initial(),restored=false;
const storageKey='splash-ad-config-v2-screenshot';
function migrateState(data){if(![3,4].includes(data?.version)||data.images?.length!==2||!data.scope?.cities?.length||!data.playback||!data.skip)return null;const old=data.playback;if(data.version===3){old.totalMs=Math.round((Number(old.first)+(data.images[1].enabled?(old.effect==='none'?0:Number(old.transition))+Number(old.second):0))*100);}if(!Number.isFinite(old.totalMs)||old.totalMs<500)old.totalMs=6000;data.version=4;data.publication={start:'',end:'',position:'App开屏',...data.publication};data.publication.position='App开屏';data.scope.platforms=data.scope.platforms.filter(p=>platforms.includes(p));return data;}
try{const data=migrateState(JSON.parse(localStorage.getItem(storageKey)||'null'));if(data){state=data;restored=true;}}catch(e){}
let panel='publish',city=state.scope.cities[0],routeImage=0,toastTimer=0;
const indices=()=>state.images[1].enabled?[0,1]:[0];
const jumpIndices=()=>indices().filter(i=>state.images[i].jump);
const total=()=>state.playback.totalMs;
const seconds=t=>String(t/1000);
function allocatePlayback(){const p=state.playback,dual=state.images[1].enabled;p.first=dual?p.totalMs/2:p.totalMs;p.second=dual?p.totalMs/2:0;p.transition=dual?Math.min(500,p.totalMs/2):0;p.effect='slide';p.times=1;p.unit='ms';p.distribution='equal';p.transitionIncluded=true;}
const route=(c,p,i)=>{const key=c+'|'+p+'|'+i;if(!state.scope.routes[key])state.scope.routes[key]={type:'web',url:'https://example.com/'+(i?'city-offers':'city-services'),access:'none'};return state.scope.routes[key];};
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3000);}
function showPanel(p){panel=p;$$('[data-panel]').forEach(btn=>{const on=btn.dataset.panel===p;btn.classList.toggle('active',on);btn.setAttribute('aria-selected',on);btn.tabIndex=on?0:-1;});$('panel-publish').hidden=p!=='publish';$('panel-scope').hidden=p!=='scope';if(p==='scope')renderScope();}
function renderImages(){state.images.forEach((img,i)=>{$('attachment-'+i).innerHTML=img.src?`<div class="attachment"><img class="attachment-image" src="${esc(img.src)}" alt="开屏图片 ${i+1}${img.demo?'（示例素材）':''}"><button class="btn text danger" data-delete-image="${i}" aria-label="删除开屏图片 ${i+1}">删除</button></div>`:`<div class="empty-upload"><button class="btn" data-upload="${i}"><svg class="icon" aria-hidden="true"><use href="#upload-icon"/></svg>上传附件</button><span class="hint">上传图片，大小为 200 KB 以内</span></div>`;$$('[name="jump-'+i+'"]').forEach(e=>e.checked=e.value===(img.jump?'yes':'no'));});const dual=state.images[1].enabled&&!!state.images[1].src;state.images[1].enabled=dual;$('jump2-row').hidden=!dual;$('image-tab-1').hidden=!dual;if(!dual)routeImage=0;}
function renderTiming(){allocatePlayback();$('total-time').value=seconds(total());}
function renderScope(){if(!state.scope.cities.includes(city))city=state.scope.cities[0];$('cities').innerHTML=state.scope.cities.map(c=>`<button class="city-btn ${c===city?'active':''}" data-city="${esc(c)}" aria-pressed="${c===city}">${esc(c)}${c===city?'<svg class="icon tick" aria-hidden="true"><use href="#check-icon"/></svg>':''}</button>`).join('');$('city-title').textContent=city;
const images=jumpIndices();document.querySelector('.city-heading').hidden=!images.length;if(!images.includes(routeImage))routeImage=images[0]??0;
$$('[data-image-tab]').forEach(btn=>{const i=Number(btn.dataset.imageTab),on=images.includes(i)&&i===routeImage;btn.hidden=!images.includes(i);btn.classList.toggle('active',on);btn.setAttribute('aria-selected',on);btn.tabIndex=on?0:-1;});
document.querySelector('.image-tabs').hidden=!images.length;$('route-fields').hidden=!images.length;$('copy-city').hidden=!images.length||!selectedRoutePlatforms().length;
if(!images.length){$('route-fields').innerHTML='';$('route-fields').removeAttribute('aria-labelledby');return;}
$('route-fields').setAttribute('aria-labelledby','image-tab-'+routeImage);
const active=selectedRoutePlatforms();if(!active.length){$('route-fields').innerHTML='<div class="empty-message">'+(state.scope.platforms.length?'微信小程序无需单独配置跳转链接。':'请至少选择一个发布平台。')+'</div>';return;}
const form=p=>{const r=route(city,p,routeImage),id=p==='APP'?'app':'alipay';return `<section><h3 class="route-heading">${esc(p)}</h3><div class="route-form"><div class="form-row"><label class="form-label required" for="type-${id}">页面类型：</label><div class="form-control"><select id="type-${id}" data-platform="${esc(p)}" data-route-field="type"><option value="web" ${r.type==='web'?'selected':''}>H5 页面</option><option value="internal" ${r.type==='internal'?'selected':''}>内部页面</option></select></div></div><div class="form-row"><label class="form-label required" for="url-${id}">url：</label><div class="form-control"><input class="input" id="url-${id}" data-platform="${esc(p)}" data-route-field="url" value="${esc(r.url)}" placeholder="${r.type==='web'?'请输入跳转链接':'/pages/service/index'}" spellcheck="false"></div></div><div class="form-row access-row"><span class="form-label access-label required" id="access-label-${id}">是否需要登录：</span><div class="form-control radio-row" role="radiogroup" aria-labelledby="access-label-${id}">${[['none','不需要登录'],['realname','实名认证'],['face','实人刷脸']].map(([value,label])=>`<label class="check"><input type="radio" name="access-${id}" value="${value}" data-platform="${esc(p)}" data-route-field="access" ${r.access===value?'checked':''}>${label}</label>`).join('')}</div></div></div></section>`;};
if(active.length===2){$('route-fields').innerHTML=form('APP')+'<div class="copy-platform"><button class="btn text" id="copy-platform">复制 &gt;</button></div>'+form('支付宝小程序');$('route-fields').style.gridTemplateColumns='';}else{$('route-fields').innerHTML=form(active[0]);$('route-fields').style.gridTemplateColumns='1fr';}
}
function checkTiming(){const e=$('total-time'),v=Number(e.value),ok=e.value.trim()!==''&&Number.isFinite(v)&&v>=.5&&Math.abs(v*10-Math.round(v*10))<1e-6,message=ok?'':'倒计时须不少于 0.5 秒，最多一位小数。';e.classList.toggle('invalid',!ok);e.setAttribute('aria-invalid',String(!ok));$('time-error').textContent=message;return message;}
function checkPublication(showErrors=true){const start=$('publish-start').value,end=$('publish-end').value;const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v+'T00:00:00Z'))&&new Date(v+'T00:00:00Z').toISOString().slice(0,10)===v;let message='';if(!start||!end)message='请选择发布时间。';else if(!validDate(start)||!validDate(end))message='请选择有效的开始日期和结束日期。';else if(start>end)message='结束日期不能早于开始日期。';$('publication-error').textContent=showErrors?message:'';$('publish-date-range').classList.toggle('invalid',showErrors&&!!message);['publish-start','publish-end'].forEach(id=>$(id).setAttribute('aria-invalid',String(showErrors&&!!message)));return message;}
function renderPublication(){['start','end'].forEach(key=>{const e=$('publish-'+key);e.value=state.publication[key]||'';e.parentElement.classList.toggle('empty',!e.value);});}
function checkPublish(){const publicationError=checkPublication();let message='';const color=s=>/^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(s);if(indices().some(i=>!state.images[i].src))message='请上传已启用的开屏图片。';else if(!$('skip-title').value.trim())message='请输入按钮标题。';else if(!color($('skip-bg').value)||!color($('skip-fg').value))message='请输入 6 位或 8 位 HEX 颜色，例如 #33333366。';$('publish-error').textContent=message;return publicationError||message;}
function checkScope(){if(!state.scope.platforms.length)return {message:'请至少选择一个发布平台。'};if(!state.scope.cities.length)return {message:'请至少添加一个发布城市。'};if(state.scope.audience==='custom'&&!state.scope.audienceDetail.trim())return {message:'请输入目标用户范围。'};for(const c of state.scope.cities)for(const p of selectedRoutePlatforms())for(const i of indices()){if(!state.images[i].jump)continue;const r=route(c,p,i);let valid=false;if(r.type==='web'){try{const u=new URL(r.url);valid=['http:','https:'].includes(u.protocol)&&!!u.hostname&&!u.username&&!u.password;}catch(e){}}else valid=/^\/(?!\/)[^\s]*$/.test(r.url);if(!valid)return {message:`${c} / ${p} / 图片 ${i+1}：请输入${r.type==='web'?'有效的 HTTP(S) 地址':'以 / 开头的内部页面路径'}。`,city:c,image:i};}return null;}
function syncPublish(){state.skip.title=$('skip-title').value.trim();state.skip.background=$('skip-bg').value;state.skip.foreground=$('skip-fg').value;state.publication.start=$('publish-start').value;state.publication.end=$('publish-end').value;state.playback.totalMs=Math.round(Number($('total-time').value)*1000);allocatePlayback();}
function saveLocal(draft=false){try{localStorage.setItem(storageKey,JSON.stringify(state));$('save-status').textContent='V2 · '+(draft?'草稿':'配置')+'已保存到本机 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · 未发布线上';return true;}catch(e){toast('浏览器无法保存，请通过导出配置保留当前内容。');return false;}}
function save(){if(checkPublish()||checkTiming()){showPanel('publish');toast('请修正发布设置后保存。');return;}syncPublish();const error=checkScope();$('scope-error').textContent=error?.message||'';if(error){if(error.city){city=error.city;routeImage=error.image;}showPanel('scope');toast(error.message);return;}if(!saveLocal())return;$('save-review').innerHTML=`<dt>版本</dt><dd>V2 · 截图还原版</dd><dt>图片数量</dt><dd>${indices().length} 张</dd><dt>倒计时</dt><dd>${seconds(total())} 秒 · 只播放 1 次</dd><dt>发布时间</dt><dd>${esc(state.publication.start)} ～ ${esc(state.publication.end)}</dd><dt>展示位置</dt><dd>App开屏</dd><dt>发布平台</dt><dd>${esc(state.scope.platforms.join('、'))}</dd><dt>发布城市</dt><dd>${state.scope.cities.length} 个</dd><dt>跳转配置</dt><dd>${indices().map(i=>'图片 '+(i+1)+'：'+(state.images[i].jump?'独立跳转':'不跳转')).join('；')}</dd>`;$('saved-dialog').showModal();}
function exportConfig(){allocatePlayback();const data=JSON.parse(JSON.stringify(state));data.playback.total=total();data.prototypeOnly=true;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='开屏广告配置-V2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$$('[data-panel]').forEach(e=>e.addEventListener('click',()=>showPanel(e.dataset.panel)));
function bindTabKeys(selector,getValue,apply){$$(selector).forEach(b=>b.addEventListener('keydown',e=>{const tabs=$$(selector).filter(x=>!x.hidden);let n=tabs.indexOf(b);if(e.key==='ArrowRight')n=(n+1)%tabs.length;else if(e.key==='ArrowLeft')n=(n-1+tabs.length)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();apply(getValue(tabs[n]));tabs[n].focus();}));}
bindTabKeys('[data-panel]',e=>e.dataset.panel,showPanel);bindTabKeys('[data-image-tab]',e=>Number(e.dataset.imageTab),i=>{routeImage=i;renderScope();});
$('next').addEventListener('click',()=>{if(checkPublish()||checkTiming()){toast('请修正发布设置后继续。');return;}syncPublish();showPanel('scope');});$('prev').addEventListener('click',()=>showPanel('publish'));$('save').addEventListener('click',save);$('save-draft').addEventListener('click',()=>{if(checkPublish()||checkTiming()){toast('请修正发布设置后保存草稿。');return;}syncPublish();if(saveLocal(true))toast('V2 草稿已保存，不影响 V1。');});$('export').addEventListener('click',exportConfig);
document.querySelector('.shell').addEventListener('click',e=>{const upload=e.target.closest('[data-upload]');if(upload){$('upload-'+upload.dataset.upload).click();return;}const remove=e.target.closest('[data-delete-image]');if(!remove)return;const i=Number(remove.dataset.deleteImage);Object.assign(state.images[i],{src:'',name:'',demo:false,enabled:i===0});$('upload-error-'+i).textContent='';renderImages();renderTiming();renderScope();toast('图片 '+(i+1)+' 已删除'+(i===1?'，当前按单图配置。':'，请重新上传。'));});
[0,1].forEach(i=>{$('upload-'+i).addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const error=$('upload-error-'+i);error.textContent='';if(!['image/jpeg','image/png','image/webp'].includes(file.type)){error.textContent='请选择有效的图片文件。';e.target.value='';return;}if(file.size>200*1024){error.textContent='图片大小超过 200 KB，请压缩后重新上传。';e.target.value='';return;}try{const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});await new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=reject;image.src=src;});Object.assign(state.images[i],{src,name:file.name,demo:false,enabled:true});renderImages();renderTiming();renderScope();toast('图片 '+(i+1)+' 已更新。');}catch(err){error.textContent='图片无法读取，请重新选择有效图片。';}e.target.value='';});$$('[name="jump-'+i+'"]').forEach(b=>b.addEventListener('change',e=>{state.images[i].jump=e.target.value==='yes';renderScope();}));});
$('total-time').addEventListener('input',()=>{if(checkTiming())return;state.playback.totalMs=Math.round(Number($('total-time').value)*1000);allocatePlayback();});
['start','end'].forEach(key=>$('publish-'+key).addEventListener('change',e=>{state.publication[key]=e.target.value;e.target.parentElement.classList.toggle('empty',!e.target.value);checkPublication(!!$('publish-start').value&&!!$('publish-end').value);}));
$$('[name="skip-position"]').forEach(e=>e.addEventListener('change',()=>state.skip.position=e.value));
$$('[data-reset-color]').forEach(e=>e.addEventListener('click',()=>{if(e.dataset.resetColor==='background'){$('skip-bg').value='#33333366';state.skip.background='#33333366';}else{$('skip-fg').value='#FFFFFF';state.skip.foreground='#FFFFFF';}checkPublish();}));
$$('[name="audience"]').forEach(e=>e.addEventListener('change',()=>{state.scope.audience=e.value;$('audience-row').hidden=e.value==='all';}));$('audience-detail').addEventListener('input',e=>state.scope.audienceDetail=e.target.value);
$$('.platform-check').forEach(e=>e.addEventListener('change',()=>{state.scope.platforms=$$('.platform-check').filter(x=>x.checked).map(x=>x.value);renderScope();}));
$('cities').addEventListener('click',e=>{const b=e.target.closest('[data-city]');if(!b)return;city=b.dataset.city;renderScope();});
$$('[data-image-tab]').forEach(e=>e.addEventListener('click',()=>{routeImage=Number(e.dataset.imageTab);renderScope();}));
$('route-fields').addEventListener('input',e=>{const field=e.target.dataset.routeField,p=e.target.dataset.platform;if(!field)return;route(city,p,routeImage)[field]=e.target.value;$('scope-error').textContent='';});$('route-fields').addEventListener('change',e=>{if(e.target.dataset.routeField==='type')renderScope();});
$('route-fields').addEventListener('click',e=>{if(!e.target.closest('#copy-platform'))return;state.scope.routes[city+'|支付宝小程序|'+routeImage]=JSON.parse(JSON.stringify(route(city,'APP',routeImage)));renderScope();toast('当前图片的 APP 链接已复制到支付宝小程序。');});
$('manage-cities').addEventListener('click',()=>{$('city-options').innerHTML=cities.map(c=>`<label class="check"><input type="checkbox" value="${esc(c)}" ${state.scope.cities.includes(c)?'checked':''}>${esc(c)}</label>`).join('');$('cities-error').textContent='';$('cities-dialog').showModal();});$('apply-cities').addEventListener('click',()=>{const selected=$$('#city-options input:checked').map(x=>x.value);if(!selected.length){$('cities-error').textContent='请至少选择一个城市。';return;}state.scope.cities=selected;renderScope();$('cities-dialog').close();});
$('remove-city').addEventListener('click',()=>{if(state.scope.cities.length===1){toast('至少保留一个发布城市。');return;}const old=city;state.scope.cities=state.scope.cities.filter(c=>c!==city);city=state.scope.cities[0];renderScope();toast('已删除发布城市：'+old+'。');});
function copyCityRoutes(){const targets=state.scope.cities.filter(c=>c!==city),images=jumpIndices(),active=selectedRoutePlatforms();if(!targets.length){toast('请先添加其他发布城市。');return;}if(!images.length||!active.length)return;targets.forEach(c=>active.forEach(p=>images.forEach(i=>state.scope.routes[c+'|'+p+'|'+i]=JSON.parse(JSON.stringify(route(city,p,i))))));$('scope-error').textContent='';toast('已将当前城市的跳转配置复制到其他 '+targets.length+' 个勾选城市。');}
$('copy-city').addEventListener('click',copyCityRoutes);
$$('[data-close]').forEach(e=>e.addEventListener('click',()=>$(e.dataset.close).close()));
function init(){renderImages();renderPublication();$('skip-title').value=state.skip.title;$('skip-bg').value=state.skip.background;$('skip-fg').value=state.skip.foreground;$$('[name="skip-position"]').forEach(e=>e.checked=e.value===state.skip.position);$$('.platform-check').forEach(e=>e.checked=state.scope.platforms.includes(e.value));$$('[name="audience"]').forEach(e=>e.checked=e.value===state.scope.audience);$('audience-detail').value=state.scope.audienceDetail;$('audience-row').hidden=state.scope.audience==='all';renderTiming();renderScope();if(restored)$('save-status').textContent='V2 · 已恢复本机保存的配置，与 V1 独立保存。';}
init();
})();
</script></body></html>
