<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粤省事 · 原型库</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#15181c; --muted:#6b7280;
    --line:#e4e7ec; --accent:#2f6fed; --accent-soft:#eaf0ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --card:#1c1f24; --text:#eceff3; --muted:#9aa3af;
      --line:#2b3037; --accent:#6b9bff; --accent-soft:#1e2836;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}

  header{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
  .bar{display:flex;align-items:center;gap:12px;height:56px}
  .mark{
    width:26px;height:26px;border-radius:7px;flex:none;
    background:var(--accent);color:#fff;font-weight:700;font-size:13px;
    display:grid;place-items:center;
  }
  .brand{font-weight:650;font-size:15px;letter-spacing:.2px}
  .brand span{color:var(--muted);font-weight:400}
  .count{margin-left:auto;font-size:13px;color:var(--muted)}

  .hero{padding:40px 0 22px}
  h1{font-size:26px;line-height:1.3;margin:0 0 8px;letter-spacing:-.3px}
  .sub{margin:0;color:var(--muted);font-size:14px;max-width:60ch}

  .tools{display:flex;gap:10px;margin:22px 0 16px;flex-wrap:wrap}
  input[type=search]{
    flex:1;min-width:200px;padding:9px 13px;font-size:14px;font-family:inherit;
    color:var(--text);background:var(--card);
    border:1px solid var(--line);border-radius:9px;outline:none;
  }
  input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px;padding-bottom:12px}
  a.card{
    display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:16px 17px;
    transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  a.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,30,60,.07)}
  a.card.tpl{border-style:dashed}
  .top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .title{font-weight:620;font-size:15.5px}
  .date{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
  .desc{color:var(--muted);font-size:13.5px;margin:0 0 12px;min-height:2.7em}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .st{font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:600}
  .st-draft{background:#f1f2f4;color:#5b6472}
  .st-review{background:#fff4e0;color:#9a6200}
  .st-final{background:#e6f6ec;color:#1a7a42}
  .st-archived{background:#f1f2f4;color:#8a919c}
  .st-template{background:var(--accent-soft);color:var(--accent)}
  @media (prefers-color-scheme: dark){
    .st-draft,.st-archived{background:#252a31;color:#9aa3af}
    .st-review{background:#33290f;color:#e0a83c}
    .st-final{background:#12301f;color:#5cc98a}
  }
  .empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px}
  footer{margin-top:26px;padding:22px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
  code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="mark">粤</div>
    <div class="brand">粤省事 <span>· 原型库</span></div>
    <div class="count" id="count"></div>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>需求原型总览</h1>
    <p class="sub">每个原型都是一个可独立打开、可在线分享的静态页面。点卡片直接看效果，不需要下载。</p>
    <div class="tools">
      <input type="search" id="q" placeholder="搜索原型名称、说明或标签…" autocomplete="off">
    </div>
  </div>

  <div id="list" class="grid"></div>

  <footer>
    新增原型：把目录放进 <code>prototypes/</code>，再到 <code>manifest.json</code> 登记一条即可。
  </footer>
</div>

<script>
(function () {
  var ST = { draft:'草稿', review:'待评审', final:'定稿', archived:'归档', template:'模板' };
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var data = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function render(items) {
    count.textContent = items.length ? items.length + ' 个原型' : '';
    if (!items.length) {
      list.className = '';
      list.innerHTML = '<div class="empty">还没有原型。复制 <code>prototypes/_template/</code> 开始第一个吧。</div>';
      return;
    }
    list.className = 'grid';
    list.innerHTML = items.map(function (p) {
      var st = p.status && ST[p.status] ? p.status : 'draft';
      var href = p.dir.replace(/\/?$/, '/') + 'index.html';
      var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      return '<a class="card' + (st === 'template' ? ' tpl' : '') + '" href="' + esc(href) + '">' +
        '<div class="top"><div class="title">' + esc(p.title || p.dir) + '</div>' +
        '<div class="date">' + esc(p.date || '') + '</div></div>' +
        '<p class="desc">' + esc(p.desc || '') + '</p>' +
        '<div class="tags"><span class="st st-' + st + '">' + ST[st] + '</span>' + tags + '</div>' +
        '</a>';
    }).join('');
  }

  function match(kw) {
    if (!kw) return data;
    kw = kw.toLowerCase();
    return data.filter(function (p) {
      return [p.title, p.desc, (p.tags || []).join(' '), p.dir]
        .join(' ').toLowerCase().indexOf(kw) > -1;
    });
  }

  fetch('manifest.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : { prototypes: [] }; })
    .then(function (json) {
      data = (json.prototypes || []).slice().sort(function (a, b) {
        return String(b.date || '').localeCompare(String(a.date || ''));
      });
      render(data);
    })
    .catch(function () {
      data = [];
      list.innerHTML = '<div class="empty">没能读到 <code>manifest.json</code>。如果本地直接双击打开，请改用本地服务器或推送到 GitHub Pages 后再看。</div>';
    });

  document.getElementById('q').addEventListener('input', function (e) {
    render(match(e.target.value.trim()));
  });
})();
</script>
</body>
</html>
